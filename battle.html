<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小虎乘法大冒險・打怪大作戰</title>
<meta name="theme-color" content="#120b1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小虎乘法">
<link rel="stylesheet" href="assets/common.css">
<style>
body{padding-bottom:16px}
.wrap{width:min(96vw,620px);display:flex;flex-direction:column;gap:10px}

/* 上方關卡列 */
.topbar{display:flex;gap:8px;align-items:center}
.topbar .chip{
  background:linear-gradient(180deg,#2e1c47,#1a1029);border:1px solid var(--line);
  border-radius:12px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--gold2);
}
.topbar .chip b{color:var(--dim);font-weight:500;font-size:11px;margin-right:4px}
.topbar .grow{flex:1}

/* 戰場 */
.field{
  position:relative;width:100%;height:min(46vh,340px);height:min(46dvh,340px);border-radius:20px;overflow:hidden;
  border:2px solid var(--line);box-shadow:0 16px 46px #000a,inset 0 0 60px #0008;
  background:
    radial-gradient(70% 50% at 50% 100%,#4a2a6e 0%,transparent 70%),
    linear-gradient(180deg,#2a1740 0%,#180e26 100%);
}
.field::after{  /* 地板 */
  content:"";position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(180deg,#00000000,#00000066),
             repeating-linear-gradient(90deg,#ffffff08 0 2px,transparent 2px 46px);
}
/* 鏡頭：沿攻擊方向先被推開再回彈，同時推近一點點（zoom punch）。
   一般擊、弱點擊、爆擊三種強度，衰減都很快，畫面才不會糊掉 */
.field.cam1{animation:impactCam .3s cubic-bezier(.36,.07,.19,.97)}
.field.cam2{animation:impactCamMid .38s cubic-bezier(.36,.07,.19,.97)}
.field.cam3{animation:impactCamHeavy .46s cubic-bezier(.36,.07,.19,.97)}
@keyframes impactCam{
  0%{transform:none}
  12%{transform:scale(1.025) translateX(7px)}
  34%{transform:scale(1.012) translateX(-5px)}
  60%{transform:translateX(3px)}
  100%{transform:none}
}
@keyframes impactCamMid{
  0%{transform:none}
  10%{transform:scale(1.05) translateX(13px)}
  30%{transform:scale(1.02) translateX(-9px)}
  52%{transform:scale(1.008) translateX(6px)}
  74%{transform:translateX(-3px)}
  100%{transform:none}
}
@keyframes impactCamHeavy{
  0%{transform:none}
  8%{transform:scale(1.085) translateX(20px) rotate(.5deg)}
  26%{transform:scale(1.04) translateX(-14px) rotate(-.4deg)}
  46%{transform:scale(1.015) translateX(9px)}
  68%{transform:translateX(-5px)}
  100%{transform:none}
}
/* 擊殺：短暫慢動作＋壓暗，收尾才有份量 */
.field.slowmo .fighter{animation-duration:1.6s !important}
.field.slowmo::after{background:#00000066;transition:background .2s}
.field.hurt::before{
  content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
  box-shadow:inset 0 0 90px #f8717199;animation:hurtflash .5s ease-out forwards;
}
@keyframes hurtflash{to{opacity:0}}

.fighter{position:absolute;bottom:8%;z-index:3;pointer-events:none;transition:transform .12s ease-out}
/* 衝刺殘影：留在原地淡出，看得出移動軌跡 */
/* 單張圖角色的攻擊／受傷姿勢 */
#hero2.poseSwing{filter:drop-shadow(0 10px 18px #000a) brightness(1.12)}
#hero2.poseHurt{filter:drop-shadow(0 10px 18px #000a) saturate(.6) brightness(.85)}
.afterimg{
  position:absolute;bottom:8%;z-index:2;pointer-events:none;opacity:.55;
  filter:brightness(1.6) saturate(.4) drop-shadow(0 0 10px #ffe9a8);
  animation:afterimg .34s ease-out forwards;
}
@keyframes afterimg{to{opacity:0;transform:translateX(-26px) scale(.97)}}
/* 衝刺速度線 */
.speedlines{
  position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(92deg,
    transparent 0 26px,#ffffff30 26px 28px,transparent 28px 54px);
  mask-image:radial-gradient(ellipse at 70% 50%,#000 10%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at 70% 50%,#000 10%,transparent 72%);
}
.speedlines.on{animation:speedl .26s ease-out}
@keyframes speedl{0%{opacity:0;transform:translateX(30px)}35%{opacity:1}100%{opacity:0;transform:translateX(-40px)}}
.gshadow{
  position:absolute;bottom:7%;z-index:2;pointer-events:none;height:14px;border-radius:50%;
  background:radial-gradient(ellipse,#000000aa 0%,#00000055 45%,transparent 72%);
  filter:blur(2px);
}
#shHero{left:5%;width:15%}
#shMob{right:5%;width:16%;animation:shMob 2.2s ease-in-out infinite alternate}
@keyframes shMob{to{transform:scale(.86);opacity:.75}}
#hero2{left:4%;height:62%;filter:drop-shadow(0 10px 18px #000a)}
#cat2{left:22%;height:30%;opacity:0;transform:translateX(-40px);filter:drop-shadow(0 8px 14px #000a)}
/* 漂浮掛在外層 .mobwrap、受擊掛在 #mob 自己身上。
   兩個動畫如果掛同一層會互相覆蓋，命中結束的瞬間會「跳」一下回漂浮的相位 */
.mobwrap{right:4%;height:56%;animation:mobIdle 2.2s ease-in-out infinite alternate}
@keyframes mobIdle{to{transform:translateY(-10px) scale(1.02)}}
#mob{width:auto;height:100%;display:block;filter:drop-shadow(0 10px 18px #000a)}
.fighter,.mobwrap,.afterimg{will-change:transform;backface-visibility:hidden}
/* 受擊：擠壓 → 被打飛 → 晃回來，中間夾白閃再轉紅 */
#mob.hit{animation:mobHit .46s cubic-bezier(.2,1.2,.4,1), mobFlash .42s linear}
@keyframes mobHit{
  0%{transform:none}
  7%{transform:translateX(-6px) scale(1.14,.86)}      /* 先被壓扁 */
  22%{transform:translateX(38px) rotate(9deg) scale(.9,1.12)}
  45%{transform:translateX(14px) rotate(-5deg) scale(1.04,.96)}
  68%{transform:translateX(22px) rotate(3deg)}
  100%{transform:none}
}
@keyframes mobFlash{
  0%,14%{filter:brightness(7) saturate(0) drop-shadow(0 0 26px #fff)}
  34%{filter:brightness(1.7) saturate(4) sepia(.7) hue-rotate(-35deg) drop-shadow(0 0 22px #ff4d4d)}
  70%{filter:brightness(1.15) saturate(1.6) drop-shadow(0 0 12px #ff6b6b)}
  100%{filter:none}
}
/* 命中停頓：整個戰場的動畫定格幾十毫秒，重量感就是從這裡來的 */
.field.freeze .fighter,
.field.freeze .shard,
.field.freeze .impact,
.field.freeze .dmg{animation-play-state:paused !important}
.field.punch{animation:punch .16s ease-out}
@keyframes punch{40%{transform:scale(1.035)}100%{transform:none}}

/* 命中爆閃 */
.impact{
  position:absolute;z-index:6;pointer-events:none;width:130px;height:130px;
  transform:translate(-50%,-50%) scale(.2);opacity:0;
  background:
    radial-gradient(circle,#ffffffee 0%,#fff6c4aa 22%,transparent 62%),
    conic-gradient(from 0deg,transparent 0deg,#fff 6deg,transparent 12deg,transparent 84deg,
      #fff 90deg,transparent 96deg,transparent 174deg,#fff 180deg,transparent 186deg,
      transparent 264deg,#fff 270deg,transparent 276deg);
  filter:blur(.4px);
}
.impact.on{animation:impact .3s ease-out forwards}
@keyframes impact{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(18deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.7) rotate(34deg)}
}
/* 碎片 */
.shard{
  position:absolute;z-index:6;pointer-events:none;width:9px;height:9px;border-radius:2px;
  background:#ffe9a8;box-shadow:0 0 8px #ffd06688;
  animation:shard .58s cubic-bezier(.15,.7,.4,1) forwards;
}
@keyframes shard{
  0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
  100%{transform:translate(var(--sx),var(--sy)) rotate(var(--sr)) scale(.3);opacity:0}
}
#mob.die{animation:mobDie .7s ease-in forwards}
@keyframes mobDie{
  30%{transform:translateY(-14px) rotate(-10deg);filter:brightness(2)}
  100%{transform:translateY(40px) rotate(80deg) scale(.2);opacity:0}
}
#mob.attack{animation:mobAtk .5s ease-in-out}
@keyframes mobAtk{40%{transform:translateX(-90px) scale(1.06)}100%{transform:none}}

/* 斬擊特效 */
.slash{
  position:absolute;z-index:5;pointer-events:none;width:52%;height:78%;right:2%;bottom:6%;
  background:
    conic-gradient(from 196deg at 26% 34%,#ffffff00 0deg,#ffffffee 10deg,#fff3c8cc 20deg,#ffffff00 46deg),
    conic-gradient(from 206deg at 26% 34%,#ffffff00 0deg,#ffd98a88 26deg,#ffffff00 52deg);
  filter:blur(.6px) drop-shadow(0 0 18px #ffe9a8) drop-shadow(0 0 40px #ffb84d66);
  opacity:0;transform:scale(.55) rotate(-38deg);
}
.slash.on{animation:slash .35s ease-out}
@keyframes slash{
  0%{opacity:0;transform:scale(.5) rotate(-46deg)}
  18%{opacity:1;transform:scale(1.05) rotate(-18deg)}
  55%{opacity:.85;transform:scale(1.22) rotate(6deg)}
  100%{opacity:0;transform:scale(1.45) rotate(22deg)}
}
.dmg{
  position:absolute;z-index:7;font-size:clamp(22px,5.4vw,38px);font-weight:900;color:#fff;
  text-shadow:0 3px 0 #b8320f,0 0 18px #ff8a3d;pointer-events:none;
  animation:dmgUp .85s cubic-bezier(.2,1.4,.4,1) forwards;
}
@keyframes dmgUp{
  0%{transform:scale(.4);opacity:0}
  25%{transform:scale(1.25);opacity:1}
  100%{transform:translateY(-70px) scale(1);opacity:0}
}
.dmg.crit{color:#fff3c4;text-shadow:0 3px 0 #a86200,0 0 26px #ffcf5c;font-size:clamp(30px,7vw,52px)}

/* 血條 */
.bars{position:absolute;left:0;right:0;top:0;z-index:4;padding:10px 12px;display:flex;
  flex-direction:column;gap:6px}
.bar{background:#00000066;border:1px solid #ffffff22;border-radius:99px;height:16px;
  position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .35s cubic-bezier(.2,1,.3,1)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;letter-spacing:1px}
.bar.mob i{background:linear-gradient(90deg,#f87171,#dc2626)}
/* 掉血殘影：白條慢半拍才追上，看得出「這一下扣了多少」 */
.bar .ghost{background:#ffffffcc;transition:transform .55s cubic-bezier(.4,0,.2,1) .22s}
.bar.hero i{background:linear-gradient(90deg,#4ade80,#16a34a)}
.bar.timerbar{height:8px}
.bar.timerbar i{background:linear-gradient(90deg,#facc15,#f97316)}

/* 題目與答案 */
.qbox{
  border-radius:18px;padding:12px;text-align:center;
  background:linear-gradient(180deg,#3b2456,#20132f);border:2px solid var(--line);
  box-shadow:0 10px 30px #0008,inset 0 1px 0 #ffffff18;position:relative;overflow:hidden;
}
.qbox .q{font-size:clamp(30px,7.4vw,50px);font-weight:900;color:#fff;
  text-shadow:0 3px 0 #7a4a00,0 8px 22px #000a;letter-spacing:2px}
.qbox .q em{font-style:normal;color:var(--gold)}
.qbox .weak{font-size:12px;color:#ffd0a8;margin-top:2px}
.qbox.in{animation:qin .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes qin{from{transform:translateY(-14px) scale(.94);opacity:0}}

.ans{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ans button{
  height:clamp(56px,13vw,74px);border-radius:16px;cursor:pointer;border:1px solid var(--line);
  background:linear-gradient(180deg,#3a2557,#251739);color:#fff;
  font-size:clamp(22px,5.4vw,32px);font-weight:900;box-shadow:0 5px 0 #17102a;
  transition:transform .1s,background .2s;
}
.ans button:active{transform:translateY(4px);box-shadow:0 1px 0 #17102a}
.ans button.right{background:linear-gradient(180deg,#86efac,#16a34a);color:#04240f;box-shadow:0 5px 0 #0d5c26}
.ans button.wrong{background:linear-gradient(180deg,#fca5a5,#dc2626);color:#3a0505;box-shadow:0 5px 0 #7f1d1d}
.ans button:disabled{cursor:default}

/* 必殺技 */
.ult{
  display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 12px;
  background:linear-gradient(180deg,#2e1c47,#1a1029);border:1px solid var(--line);
}
.ult .bar2{flex:1;height:12px;border-radius:99px;background:#241638;overflow:hidden}
.ult .bar2 i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#6ea8ff,#f6c453);transition:width .3s ease}
.ult button{
  padding:10px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:900;font-size:15px;
  color:#3a2400;background:linear-gradient(180deg,#fff0c4,var(--gold));box-shadow:0 4px 0 #a97a12;
}
.ult button:disabled{filter:grayscale(.7) brightness(.6);cursor:default}
.ult button.ready{animation:ultReady .7s ease-in-out infinite alternate}
@keyframes ultReady{to{box-shadow:0 4px 0 #a97a12,0 0 26px #f6c453}}

/* 必殺技全螢幕演出 */
.ultfx{
  position:fixed;inset:0;z-index:19;display:none;align-items:center;justify-content:center;
  background:#000000cc;pointer-events:none;
}
.ultfx.on{display:flex;animation:fade .2s}
.ultfx .line{position:absolute;inset:0;
  background:repeating-linear-gradient(100deg,#ffffff22 0 6px,transparent 6px 22px);
  animation:speed .5s linear infinite}
@keyframes speed{to{transform:translateX(-28px)}}
.ultfx img{height:min(46vh,360px);animation:ultCat .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes ultCat{
  0%{transform:translateX(-60vw) scale(.6) rotate(-20deg);opacity:0}
  40%{transform:none;opacity:1}
  100%{transform:translateX(50vw) scale(1.1);opacity:0}
}
.ultfx b{position:absolute;font-size:clamp(30px,9vw,68px);color:#fff;letter-spacing:6px;
  text-shadow:0 4px 0 #a83a00,0 0 40px #ffb547;animation:ultText .9s ease-out}
@keyframes ultText{from{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}}

/* 等級與經驗 */
.lvchip{display:flex;align-items:center;gap:6px}
.expbar{width:70px;height:7px;border-radius:99px;background:#241638;overflow:hidden}
.expbar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#6ea8ff,#f6c453);transition:width .4s ease}
.bagbtn{cursor:pointer;position:relative;font-family:inherit}
.dot2{display:none;position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;
  background:#f87171;box-shadow:0 0 8px #f87171}
.dot2.on{display:block;animation:pulse .7s infinite alternate}

/* 掉落提示 */
.drop{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:9;pointer-events:none;
  background:linear-gradient(180deg,#2f1d48ee,#1a1028ee);border:2px solid var(--gold);
  border-radius:14px;padding:10px 18px;text-align:center;display:none;box-shadow:0 10px 30px #000b;
}
.drop.on{display:block;animation:dropIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes dropIn{from{transform:translate(-50%,-20%) scale(.6);opacity:0}}
.drop b{display:block;font-size:16px;font-weight:900}
.drop small{font-size:12px;color:var(--dim)}
.drop .rar{font-size:11px;font-weight:800}

/* 裝備視窗 */
.gearwin{position:fixed;inset:0;z-index:22;display:none;align-items:center;justify-content:center;
  background:#0b0714e8;backdrop-filter:blur(6px);padding:14px}
.gearwin.on{display:flex;animation:fade .25s}
.gearbox{
  width:min(94vw,520px);max-height:92vh;overflow:auto;border-radius:20px;padding:18px;
  background:linear-gradient(180deg,#2f1d48,#1a1028);border:1px solid var(--line);
  box-shadow:0 20px 60px #000b;animation:cardin .35s cubic-bezier(.2,1.5,.4,1);
}
.gearbox h2{font-size:20px;color:var(--gold);letter-spacing:2px;text-align:center;margin-bottom:4px}
.power{display:flex;gap:6px;margin:10px 0}
.power div{flex:1;background:#241638;border:1px solid var(--line);border-radius:10px;
  padding:6px 2px;text-align:center;font-size:13px;font-weight:800;color:var(--gold2)}
.power div b{display:block;font-size:10px;color:var(--dim);font-weight:500}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{
  background:#241638;border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center;
  min-height:86px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;
}
.slot .ic{font-size:22px}
.slot .nm{font-size:12px;font-weight:800}
.slot .st2{font-size:10px;color:var(--dim);line-height:1.4}
.slot.empty .nm{color:#6b578a}
.baglist{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.bagitem{
  display:flex;align-items:center;gap:8px;background:#241638;border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;
}
.bagitem .ic{font-size:20px}
.bagitem .info{flex:1;text-align:left}
.bagitem .info b{display:block;font-size:13px}
.bagitem .info small{font-size:11px;color:var(--dim)}
.bagitem button{
  padding:6px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;
  background:#3a2456;color:var(--gold2);font-size:12px;font-weight:800;
}
.bagitem button.eq{background:linear-gradient(180deg,#fff0c4,var(--gold));color:#3a2400;border:none}
.bagitem.better{box-shadow:0 0 0 2px #4ade8066 inset}
.empty-tip{text-align:center;color:var(--dim);font-size:12px;padding:14px}

/* ===== 魔法 ===== */
.spell{
  position:absolute;z-index:7;pointer-events:none;height:38%;left:16%;bottom:22%;
  mix-blend-mode:screen;
  filter:drop-shadow(0 0 22px var(--sc,#ffd06688)) drop-shadow(0 0 44px var(--sc,#ff8a3d66));
  opacity:0;
}
.spell.fly{animation:spellFly .5s cubic-bezier(.35,0,.7,.6) forwards}
@keyframes spellFly{
  0%{opacity:0;transform:translateX(-40px) scale(.4) rotate(-12deg)}
  18%{opacity:1;transform:translateX(0) scale(.95)}
  85%{opacity:1;transform:translateX(330px) scale(1.15) rotate(8deg)}
  100%{opacity:0;transform:translateX(360px) scale(1.3)}
}
.spell.drop{animation:spellDrop .5s cubic-bezier(.4,0,.6,1) forwards}
@keyframes spellDrop{
  0%{opacity:0;transform:translate(300px,-160px) scale(.6)}
  25%{opacity:1}
  70%{opacity:1;transform:translate(310px,20px) scale(1.2)}
  100%{opacity:0;transform:translate(310px,30px) scale(1.35)}
}
/* 腳下魔法陣 */
.circle{
  position:absolute;z-index:2;pointer-events:none;left:2%;bottom:2%;width:26%;
  mix-blend-mode:screen;
  opacity:0;transform:scaleY(.35);
  filter:drop-shadow(0 0 20px var(--sc,#ffd06688));
}
.circle.on{animation:circleUp .8s ease-out forwards}
@keyframes circleUp{
  0%{opacity:0;transform:scaleY(.35) scale(.5) rotate(0)}
  30%{opacity:1;transform:scaleY(.35) scale(1.05) rotate(60deg)}
  100%{opacity:0;transform:scaleY(.35) scale(1.25) rotate(200deg)}
}
/* 施法時角色被光包住 */
.field.casting .fighter#hero2{filter:drop-shadow(0 0 26px var(--sc,#ffd066)) brightness(1.25)}

/* ===== 連擊特效：邊框發光＋大字 ===== */
.comboFrame{
  position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:20px;opacity:0;
  box-shadow:inset 0 0 0 3px var(--cc,#f6c453),inset 0 0 44px var(--cc,#f6c45366);
}
.comboFrame.on{animation:cframe .9s ease-out}
@keyframes cframe{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
.comboBig{
  position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;
  font-size:clamp(26px,7vw,52px);font-weight:900;letter-spacing:2px;opacity:0;white-space:nowrap;
  color:#fff;text-shadow:0 3px 0 #a83a00,0 0 30px var(--cc,#f6c453);
}
.comboBig.on{animation:cbig .95s cubic-bezier(.2,1.6,.4,1)}
@keyframes cbig{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}
  70%{opacity:1;transform:translate(-50%,-58%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-72%) scale(.95)}
}
/* 連擊到一定次數，整個戰場邊緣冒火／結霜／帶電 */
.field.aura1{box-shadow:0 16px 46px #000a,inset 0 0 60px #0008,inset 0 0 40px #f6c45355}
.field.aura2{box-shadow:0 16px 46px #000a,inset 0 0 60px #0008,inset 0 0 60px #6ea8ff66}
.field.aura3{box-shadow:0 16px 46px #000a,inset 0 0 60px #0008,inset 0 0 80px #f87171aa}

.tip{font-size:12px;color:var(--dim);text-align:center;line-height:1.7}
.tip b{color:var(--gold2)}

/* ---------- 手機：小螢幕上角色跟怪物會疊在一起，戰場拉高、兩邊各自縮一點 ---------- */
@media (max-width:520px){
  body{padding-bottom:96px}
  .topbar{gap:6px;flex-wrap:nowrap}
  .topbar .chip{padding:6px 9px;font-size:13px;white-space:nowrap}
  .topbar .bagbtn{padding:11px 12px;font-size:13px}
  .topbar .chip b{font-size:10px;margin-right:3px}
  .field{height:min(42vh,330px);height:min(42dvh,330px)}
  #hero2{left:1%;height:52%}
  .mobwrap{right:1%;height:46%}
  #shHero{left:2%;width:17%}
  #shMob{right:2%;width:17%}
  .qbox{padding:10px 12px}
  .qbox .q{font-size:clamp(26px,8vw,38px)}
  .ans button{height:56px;font-size:22px}
  .tip{font-size:11px;line-height:1.7}
}
</style>
</head>
<body>
<h1>打 怪 大 作 戰</h1>
<div class="vers"></div>

<div class="wrap">
  <div class="topbar">
    <div class="chip lvchip"><b>Lv</b><span id="lv">1</span>
      <div class="expbar"><i id="expBar"></i></div>
    </div>
    <div class="chip"><b>金幣</b><span id="gold">0</span></div>
    <div class="chip"><b>關卡</b><span id="stage">1-1</span></div>
    <div class="grow"></div>
    <button class="chip bagbtn" id="bagBtn">🎒 裝備 <i class="dot2" id="bagDot"></i></button>
  </div>

  <div class="field" id="field">
    <div class="bars">
      <div class="bar mob"><i class="ghost" id="mobHpGhost"></i><i id="mobHp"></i><span id="mobHpText">敵人</span></div>
      <div class="bar timerbar"><i id="mobTimer"></i></div>
      <div class="bar hero"><i class="ghost" id="heroHpGhost"></i><i id="heroHp"></i><span id="heroHpText">小勇者</span></div>
    </div>
    <div class="gshadow" id="shHero"></div>
    <div class="gshadow" id="shMob"></div>
    <img class="fighter" id="hero2" src="assets/fx_hero_ready.webp" alt="">
    <img class="fighter" id="cat2" src="assets/fx_cat_attack.webp" alt="">
    <div class="fighter mobwrap" id="mobWrap"><img id="mob" src="assets/mob_slime.webp" alt=""></div>
    <div class="slash" id="slash"></div>
    <div class="speedlines" id="speedlines"></div>
    <img class="circle" id="circle" src="assets/fx_holy.webp" alt="">
    <img class="spell" id="spell" src="assets/fx_fire.webp" alt="">
    <div class="comboFrame" id="comboFrame"></div>
    <div class="comboBig" id="comboBig"></div>
    <div class="impact" id="impact"></div>
    <div class="drop" id="drop"></div>
  </div>

  <div class="qbox" id="qbox">
    <div class="q" id="q">準備好了嗎？</div>
    <div class="weak" id="weakTip"></div>
  </div>

  <div class="ans" id="ans"></div>

  <div class="ult">
    <span style="font-size:13px;font-weight:800;color:var(--gold2)">必殺技</span>
    <div class="bar2"><i id="ultBar"></i></div>
    <button id="ultBtn" disabled>小虎撲擊</button>
  </div>

  <button class="btn" id="start">開 始 冒 險</button>

  <p class="tip">
    答對就出手，<b>答得越快傷害越高</b>；敵人上方的黃條倒數完會反擊。<br>
    每隻敵人都有<b>害怕的乘法表</b>，打中弱點是<b>兩倍傷害</b>。<br>
    連續答對會自動放魔法：<b>3 連火球術</b>、<b>5 連冰霜術</b>、<b>7 連落雷術</b>、<b>10 連聖光審判</b>（還會回血）。
  </p>
</div>

<div class="ultfx" id="ultfx">
  <div class="line"></div>
  <img id="ultCat" src="assets/fx_cat_attack.webp" alt="">
  <b>小虎撲擊！</b>
</div>

<div class="gearwin" id="gearwin">
  <div class="gearbox">
    <h2>裝 備</h2>
    <div class="power" id="power"></div>
    <div class="slots" id="slots"></div>
    <div class="baglist" id="baglist"></div>
    <button class="btn" id="closeGear" style="width:100%;margin-top:14px">關 閉</button>
    <button class="btn ghost" id="resetSave" style="width:100%;margin-top:8px;height:40px">清除存檔重新開始</button>
  </div>
</div>

<div class="over" id="over">
  <div class="card">
    <h2 id="ovTitle">這次沒過關</h2>
    <div class="big" id="ovBig">1-1</div>
    <div class="line">打倒的敵人 <span id="ovKill">0</span></div>
    <div class="line">造成的總傷害 <span id="ovDmg">0</span></div>
    <div class="line">答對／答錯 <span id="ovQA">0 / 0</span></div>
    <div class="line">最快作答 <span id="ovFast">—</span></div>
    <div class="line">獲得金幣 <span id="ovGold">0</span></div>
    <div class="weak"><h3>最該再練的乘法</h3><ul id="ovWeak"></ul></div>
    <button class="btn" id="again">再 挑 戰 一 次</button>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
/* ---------- 敵人：每隻怕不同的乘法表，打弱點兩倍傷害 ---------- */
const MOBS = [
  {img:'assets/mob_slime.webp',  name:'黏黏怪',   hp:110, atk:10, weak:[2,3],   exp:24, drop:0.40},
  {img:'assets/mob_bat.webp',    name:'小蝙蝠',   hp:135, atk:12, weak:[4,5],   exp:30, drop:0.45},
  {img:'assets/mob_mush.webp',   name:'香菇怪',   hp:165, atk:13, weak:[6],     exp:36, drop:0.50},
  {img:'assets/mob_rock.webp',   name:'石頭怪',   hp:195, atk:15, weak:[7],     exp:42, drop:0.55},
  {img:'assets/mob_ghost.webp',  name:'幽靈球',   hp:225, atk:16, weak:[8],     exp:48, drop:0.55},
  {img:'assets/mob_cactus.webp', name:'仙人掌',   hp:255, atk:17, weak:[9],     exp:54, drop:0.60},
  {img:'assets/mob_ice.webp',    name:'冰晶怪',   hp:290, atk:18, weak:[6,7],   exp:62, drop:0.62},
  {img:'assets/mob_flame.webp',  name:'火焰怪',   hp:320, atk:19, weak:[8,9],   exp:70, drop:0.65},
  {img:'assets/mob_robot.webp',  name:'鐵皮機器', hp:355, atk:20, weak:[7,8],   exp:80, drop:0.70},
  {img:'assets/mob_boss.webp',   name:'虎王石像', hp:430, atk:22, weak:[7,8,9], exp:110, drop:1, boss:true},
  {img:'assets/mob_dragon.webp', name:'紫金巨龍', hp:560, atk:26, weak:[6,7,8,9], exp:150, drop:1, boss:true}
];
const ANSWER_TIME = 9;

let P = Save.power();                 // 目前能力（基礎＋裝備）
let maxHp = P.hp, heroHp = P.hp;
let wave = Save.d.wave, round = Save.d.round;
let mob = null, mobHp = 0;
let qa = 1, qb = 1, ans = 0, qStart = 0, locked = true, running = false;
let ult = 0, combo = 0, kills = 0, totalDmg = 0, right = 0, wrong = 0, fastest = null;
let earnGold = 0, earnExp = 0, drops = [];
let mobTimer = ANSWER_TIME, loop = null;

const F = () => $('field');
const setBar = (el, r) => el.style.transform = 'scaleX(' + Math.max(0, Math.min(1, r)) + ')';
/* 血條連殘影一起更新：紅條立刻掉，白條慢半拍追上 */
function setHp(who, r){
  setBar($(who), r);
  setBar($(who + 'Ghost'), r);
}

/* ---------- 角色逐格動畫 ---------- */
const HERO_FRAMES = {
  ready:'assets/fx_hero_ready.webp', swing:'assets/fx_hero_swing.webp',
  after:'assets/fx_hero_after.webp', hurt:'assets/fx_hero_hurt.webp'
};
const ready = {};
const SPELL_IMG = {
  fire:'assets/fx_fire.webp', ice:'assets/fx_ice.webp',
  thunder:'assets/fx_thunder.webp', holy:'assets/fx_holy.webp', slash:'assets/fx_slash_big.webp'
};
/* 一開始只載「馬上要用到的」：角色四格、貓、目前這隻怪與下一隻。
   魔法特效與後面的怪等閒下來再補，手機第一次進來才不用先吞掉一大包圖 */
const requested = new Set();          // ready 只放「載好了」，要不要重複發請求另外記
function preload(list){
  for(const src of list){
    if(!src || requested.has(src)) continue;
    requested.add(src);
    const im = new Image();
    im.onload = () => ready[src] = true;
    im.src = src;
  }
}
let HERO = heroOf(Save.d.hero);
function preloadNearby(){
  const i = Math.min(MOBS.length - 1, (Save.d.wave || 0));
  preload([MOBS[i] && MOBS[i].img, MOBS[i+1] && MOBS[i+1].img]);
}
preload([...Object.values(HERO_FRAMES), 'assets/fx_cat_attack.webp', HERO.img]);
preloadNearby();
const preloadRest = () => {
  preload([...MOBS.map(m => m.img), ...Object.values(SPELL_IMG), ...HEROES.map(h => h.img)]);
};
/* 等首屏該載的都載完、再閒個一秒多才補其餘的圖，才不會跟首屏搶頻寬 */
addEventListener('load', () => setTimeout(() => {
  if('requestIdleCallback' in window) requestIdleCallback(preloadRest, {timeout:3000});
  else preloadRest();
}, 1200));
/* 小虎姬有分解動作就換圖；其他角色只有一張，改用變形表現動作 */
function heroFrame(k){
  const el = $('hero2');
  if(HERO.frames){
    if(ready[HERO_FRAMES[k]]) el.src = HERO_FRAMES[k];
    el.classList.remove('poseSwing','poseHurt');
  }else{
    if(ready[HERO.img]) el.src = HERO.img;
    el.classList.toggle('poseSwing', k === 'swing' || k === 'after');
    el.classList.toggle('poseHurt', k === 'hurt');
  }
}

function afterImage(){
  const h = $('hero2');
  const img = document.createElement('img');
  img.className = 'afterimg';
  img.src = h.src;
  img.style.left = h.style.left || getComputedStyle(h).left;
  img.style.height = getComputedStyle(h).height;
  img.style.transform = h.style.transform;
  F().appendChild(img);
  setTimeout(()=>img.remove(), 360);
}
/* 攻擊節奏照動畫原理走：預備 → 衝刺 → 命中 → 收招。
   整段是「一條」時間軸（Web Animations API），不是五顆 setTimeout 疊出來的——
   分開排程各自會漂移，中間就會看到卡頓。換圖的時間點也一起掛在同一條軸上。 */
const SWING_MS = 620;
function heroSwing(onHit){
  const h = $('hero2');
  heroFrame('ready');
  h.style.transform = '';
  h.style.transition = 'none';

  const anim = h.animate([
    {offset:0,    transform:'translateX(0) scale(1,1)',            easing:'cubic-bezier(.3,.9,.5,1)'},
    {offset:.21,  transform:'translateX(-20px) scale(1.03,.95)',   easing:'cubic-bezier(.55,0,.9,.45)'},
    {offset:.40,  transform:'translateX(132px) scale(1.07,.97)',   easing:'cubic-bezier(.2,.7,.4,1)'},
    {offset:.47,  transform:'translateX(122px) scale(1.02,1.02)',  easing:'cubic-bezier(.3,0,.5,1)'},
    {offset:.70,  transform:'translateX(56px) scale(.99,1.02)',    easing:'cubic-bezier(.2,1.1,.4,1)'},
    {offset:1,    transform:'translateX(0) scale(1,1)'}
  ], {duration:SWING_MS, fill:'none'});
  h._swing = anim;

  const at = (k, fn) => setTimeout(fn, SWING_MS * k);
  at(.21, () => {                                    // 衝刺起步：換圖、速度線、殘影
    heroFrame('swing');
    const sl = $('speedlines');
    sl.classList.remove('on'); void sl.offsetWidth; sl.classList.add('on');
    afterImage();
  });
  at(.30, afterImage);
  at(.40, () => {                                    // 命中
    heroFrame('after');
    const s = $('slash');
    s.classList.remove('on'); void s.offsetWidth; s.classList.add('on');
    onHit && onHit();
  });
  at(.72, () => heroFrame('ready'));
}
function heroHurtAnim(){
  const h = $('hero2');
  heroFrame('hurt');
  h.style.transition = 'none';
  h.animate([
    {offset:0,   transform:'translateX(0) rotate(0)'},
    {offset:.18, transform:'translateX(-28px) rotate(-7deg)', easing:'cubic-bezier(.2,.9,.4,1)'},
    {offset:.55, transform:'translateX(-10px) rotate(-2deg)', easing:'cubic-bezier(.2,1.2,.4,1)'},
    {offset:1,   transform:'translateX(0) rotate(0)'}
  ], {duration:520, fill:'none'});
  setTimeout(()=>heroFrame('ready'), 430);
}
function catRush(){
  const c = $('cat2');
  c.style.transition = 'none'; c.style.opacity = '0'; c.style.transform = 'translateX(-60px) scale(.7)';
  requestAnimationFrame(()=>{
    c.style.transition = 'transform .5s cubic-bezier(.2,1.5,.4,1),opacity .15s';
    c.style.opacity = '1'; c.style.transform = 'translateX(190px) scale(1.15)';
    setTimeout(()=>{ c.style.opacity = '0'; c.style.transform = 'translateX(240px) scale(.8)'; }, 480);
  });
}
function shake(){ F().classList.remove('shake'); void F().offsetWidth; F().classList.add('shake'); }

/* ---------- 打擊感 ----------
   命中停頓 → 爆閃 → 碎片 → 擠壓變形 → 震動，五件事疊起來才有「打到東西」的感覺 */
function mobCenter(){
  const f = F().getBoundingClientRect(), m = $('mob').getBoundingClientRect();
  return {x: m.left - f.left + m.width*0.42, y: m.top - f.top + m.height*0.45};
}
function impactAt(pt){
  const el = $('impact');
  el.style.left = pt.x + 'px';
  el.style.top  = pt.y + 'px';
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}
const SMALL_SCREEN = matchMedia('(max-width:520px)').matches;
function shards(pt, n, crit){
  n = Math.max(4, Math.round(n * (SMALL_SCREEN ? .6 : 1)));   // 手機少噴一點，才不會掉幀
  for(let i=0;i<n;i++){
    const d = document.createElement('div');
    d.className = 'shard';
    // 沿攻擊方向（由左往右）噴出去，扇形 ±55 度，這樣看得出這一下是從哪個方向打的
    const ang = (-55 + Math.random()*110) * Math.PI/180;
    const dist = 50 + Math.random()*(crit ? 150 : 95);
    d.style.setProperty('--sx', Math.cos(ang)*dist + 'px');
    d.style.setProperty('--sy', (Math.sin(ang)*dist + 30) + 'px');   // 尾端受重力往下掉
    d.style.setProperty('--sr', (Math.random()*720-360) + 'deg');
    d.style.left = (pt.x + (Math.random()*30-15)) + 'px';
    d.style.top  = (pt.y + (Math.random()*30-15)) + 'px';
    const sz = 6 + Math.random()*(crit ? 9 : 6);
    d.style.width = d.style.height = sz + 'px';
    d.style.animationDuration = (.45 + Math.random()*.3) + 's';
    if(crit && i % 3 === 0) d.style.background = '#fff';
    F().appendChild(d);
    setTimeout(()=>d.remove(), 900);
  }
}
/* 戰場上正在跑的動畫（含角色那條時間軸）一起暫停／放慢。
   血條的 transition 要排除掉——凍住的話，白色殘影慢半拍追上的效果就沒了 */
function fieldAnims(){
  try{
    return F().getAnimations({subtree:true}).filter(a => {
      const t = a.effect && a.effect.target;
      return t && t.closest && !t.closest('.bars');
    });
  }catch(e){ return []; }
}
function freezeField(ms){
  const list = fieldAnims();
  list.forEach(a => { try{ a.pause(); }catch(e){} });
  setTimeout(() => list.forEach(a => { try{ a.play(); }catch(e){} }), ms);
}
function slowmoField(ms, rate){
  const list = fieldAnims();
  list.forEach(a => { try{ a.playbackRate = rate; }catch(e){} });
  setTimeout(() => list.forEach(a => { try{ a.playbackRate = 1; }catch(e){} }), ms);
}
/* 命中：停頓 → 方向性鏡頭 → 爆閃 → 沿攻擊向量噴粒子。
   停頓長度照業界慣例：一般 3~5 幀、重擊 8 幀上下、致命一擊 0.25 秒 */
function hitEffect(crit, weak, lethal){
  const m = $('mob'), f = F();
  m.classList.remove('hit'); void m.offsetWidth; m.classList.add('hit');
  const pt = mobCenter();
  impactAt(pt);
  shards(pt, lethal ? 26 : crit ? 20 : weak ? 14 : 10, crit || lethal);

  const stop = lethal ? 250 : crit ? 150 : weak ? 110 : 80;
  const cam  = lethal ? 'cam3' : crit ? 'cam3' : weak ? 'cam2' : 'cam1';
  f.classList.add('freeze');
  freezeField(stop);
  setTimeout(()=>f.classList.remove('freeze'), stop);
  f.classList.remove('cam1','cam2','cam3'); void f.offsetWidth;
  f.classList.add(cam);
  setTimeout(()=>f.classList.remove(cam), 500);
  Sfx.hit(crit || lethal);
}
function dmgText(text, crit){
  const d = document.createElement('div');
  d.className = 'dmg' + (crit ? ' crit' : '');
  d.textContent = text;
  d.style.right = (12 + Math.random()*14) + '%';
  d.style.bottom = (44 + Math.random()*10) + '%';
  F().appendChild(d);
  setTimeout(()=>d.remove(), 900);
}

/* ---------- 存檔面板 ---------- */
function paintTop(){
  $('lv').textContent = Save.d.lv;
  $('gold').textContent = Save.d.gold;
  $('expBar').style.width = (Save.d.exp / Save.needExp() * 100) + '%';
  $('stage').textContent = round + '-' + (wave+1);
  $('bagDot').classList.toggle('on', hasBetter());
}
function hasBetter(){
  return Save.d.bag.some(it => {
    const cur = Save.d.gear[it.slot];
    return !cur || it.score > cur.score;
  });
}
function paintGear(){
  P = Save.power();
  $('power').innerHTML =
    '<div><b>攻擊</b>' + P.atk + '</div>' +
    '<div><b>血量</b>' + P.hp + '</div>' +
    '<div><b>爆擊</b>' + P.crit + '%</div>' +
    '<div><b>必殺充能</b>' + P.ult + '</div>';
  const slotName = {weapon:'武器', armor:'防具', charm:'飾品'};
  $('slots').innerHTML = ['weapon','armor','charm'].map(k => {
    const it = Save.d.gear[k];
    if(!it) return '<div class="slot empty"><div class="ic">➕</div><div class="nm">' +
      slotName[k] + '</div><div class="st2">還沒有裝備</div></div>';
    return '<div class="slot" style="border-style:solid;border-color:' + it.color + '">' +
      '<div class="ic">' + it.icon + '</div>' +
      '<div class="nm" style="color:' + it.color + '">' + it.name + '</div>' +
      '<div class="st2">' + gearLine(it) + '</div></div>';
  }).join('');

  const bag = Save.d.bag.slice().sort((a,b)=>b.score-a.score);
  $('baglist').innerHTML = bag.length ? bag.map(it => {
    const cur = Save.d.gear[it.slot];
    const better = !cur || it.score > cur.score;
    return '<div class="bagitem' + (better ? ' better' : '') + '">' +
      '<div class="ic">' + it.icon + '</div>' +
      '<div class="info"><b style="color:' + it.color + '">' + it.name +
        ' <span class="rar">' + it.rarity + '</span>' + (better ? ' ⬆' : '') + '</b>' +
        '<small>' + gearLine(it) + '</small></div>' +
      '<button class="eq" data-eq="' + it.id + '">裝備</button>' +
      '<button data-sell="' + it.id + '">賣 ' + sellPrice(it) + '</button></div>';
  }).join('') : '<div class="empty-tip">背包是空的，打倒敵人就會掉裝備</div>';
  paintTop();
}
const sellPrice = it => Math.max(5, Math.round(it.score * 0.8));
function equip(id){
  const i = Save.d.bag.findIndex(x => x.id === id);
  if(i < 0) return;
  const it = Save.d.bag.splice(i,1)[0];
  const old = Save.d.gear[it.slot];
  if(old) Save.d.bag.push(old);
  Save.d.gear[it.slot] = it;
  Save.put(); paintGear();
  Sfx.ok(3);
  // 換裝會改變最大血量，戰鬥中同步補上差額
  const np = Save.power();
  if(running){ heroHp = Math.min(np.hp, heroHp + Math.max(0, np.hp - maxHp)); }
  maxHp = np.hp;
  paintHeroBar();
}
function sell(id){
  const i = Save.d.bag.findIndex(x => x.id === id);
  if(i < 0) return;
  Save.d.gold += sellPrice(Save.d.bag[i]);
  Save.d.bag.splice(i,1);
  Save.put(); paintGear(); Sfx.tick();
}
$('baglist').addEventListener('click', e => {
  const eq = e.target.closest('[data-eq]'), sl = e.target.closest('[data-sell]');
  if(eq) equip(eq.dataset.eq);
  else if(sl) sell(sl.dataset.sell);
});
$('bagBtn').onclick = () => { paintGear(); $('gearwin').classList.add('on'); };
$('closeGear').onclick = () => $('gearwin').classList.remove('on');
$('resetSave').onclick = () => {
  if(!confirm('確定要清除存檔嗎？等級、金幣、裝備都會不見。')) return;
  Save.reset();
  round = 1; wave = 0;
  P = Save.power(); maxHp = P.hp; heroHp = P.hp;
  paintGear(); setMob(); paintHeroBar();
  $('gearwin').classList.remove('on');
};

function paintHeroBar(){
  setHp('heroHp', heroHp / maxHp);
  $('heroHpText').textContent = HERO.name + ' Lv' + Save.d.lv + '　' + heroHp + ' / ' + maxHp;
}

/* ---------- 魔法：連續答對到門檻自動施放，越連越強 ---------- */
const SPELLS = [
  {at:3,  key:'fire',    name:'火球術',   color:'#ff8a3d', mult:1.6, mode:'fly',  word:'3 連擊！火球術'},
  {at:5,  key:'ice',     name:'冰霜術',   color:'#6ea8ff', mult:2.2, mode:'fly',  word:'5 連擊！冰霜術'},
  {at:7,  key:'thunder', name:'落雷術',   color:'#c4b5fd', mult:3.0, mode:'drop', word:'7 連擊！落雷術'},
  {at:10, key:'holy',    name:'聖光審判', color:'#ffe9a8', mult:4.2, mode:'drop', word:'10 連擊！聖光審判', heal:20}
];
function spellFor(c){
  // 10 連之後每 5 連再放一次聖光
  if(c >= 10 && (c - 10) % 5 === 0) return SPELLS[3];
  return SPELLS.find(s => s.at === c) || null;
}
function comboShout(text, color){
  const f = $('comboFrame'), b = $('comboBig');
  f.style.setProperty('--cc', color); b.style.setProperty('--cc', color);
  b.textContent = text;
  f.classList.remove('on'); b.classList.remove('on');
  void f.offsetWidth;
  f.classList.add('on'); b.classList.add('on');
}
function comboAura(c){
  const f = F();
  f.classList.remove('aura1','aura2','aura3');
  if(c >= 10) f.classList.add('aura3');
  else if(c >= 6) f.classList.add('aura2');
  else if(c >= 3) f.classList.add('aura1');
}
/* 施法：魔法陣 → 投射物飛過去 → 命中 */
function castSpell(sp){
  return new Promise(resolve => {
    const f = F(), sprite = $('spell'), circ = $('circle');
    f.style.setProperty('--sc', sp.color + '99');
    f.classList.add('casting');
    comboShout(sp.word, sp.color);

    if(ready[SPELL_IMG.holy]) circ.src = SPELL_IMG.holy;
    circ.style.setProperty('--sc', sp.color + '99');
    circ.classList.remove('on'); void circ.offsetWidth; circ.classList.add('on');
    Sfx.next();

    setTimeout(()=>{
      if(ready[SPELL_IMG[sp.key]]) sprite.src = SPELL_IMG[sp.key];
      sprite.style.setProperty('--sc', sp.color + '99');
      sprite.classList.remove('fly','drop'); void sprite.offsetWidth;
      sprite.classList.add(sp.mode === 'drop' ? 'drop' : 'fly');
      // 施法音：往上爬的和弦
      [523,659,784].forEach((hz,i)=>setTimeout(()=>beep(hz,.14,'sine',.09), i*70));
    }, 260);

    setTimeout(()=>{
      const dmg = Math.round(P.atk * sp.mult * (P.spell || 1) + 6);
      mobHp = Math.max(0, mobHp - dmg);
      totalDmg += dmg;
      hitEffect(true, true, mobHp <= 0);
      dmgText(sp.name + ' -' + dmg, true);
      setHp('mobHp', mobHp / mob.hp);
      $('mobHpText').textContent = mob.name + '　' + mobHp + ' / ' + mob.hp;
      if(sp.heal){
        heroHp = Math.min(maxHp, heroHp + sp.heal);
        paintHeroBar();
        dmgText('+' + sp.heal + ' 回血', false);
      }
      f.classList.remove('casting');
      Char.react(true, true, sp.name + '！');
      Char.cat(true);
      resolve(mobHp <= 0);
    }, 700);
  });
}

/* ---------- 出題 ---------- */
function newQ(){
  const w = mob.weak;
  const useWeak = Math.random() < .7;
  qa = useWeak ? w[(Math.random()*w.length)|0] : 2 + (Math.random()*8|0);
  qb = 2 + (Math.random()*8|0);
  ans = qa * qb;
  $('q').innerHTML = qa + ' <em>×</em> ' + qb + ' <em>=</em> ?';
  $('weakTip').textContent = w.includes(qa) || w.includes(qb)
    ? '⚡ 這題打中 ' + mob.name + ' 的弱點，傷害兩倍' : '';
  const box = $('qbox');
  box.classList.remove('in'); void box.offsetWidth; box.classList.add('in');

  const cand = new Set([ans]);
  for(const v of [qa*(qb+1), qa*(qb-1), (qa+1)*qb, (qa-1)*qb, ans+qa, ans-qb, ans+2, ans-3].sort(()=>Math.random()-.5)){
    if(v > 0 && !cand.has(v)) cand.add(v);
    if(cand.size >= 4) break;
  }
  const list = [...cand].slice(0,4).sort(()=>Math.random()-.5);
  const box2 = $('ans');
  box2.innerHTML = '';
  for(const v of list){
    const b = document.createElement('button');
    b.textContent = v;
    b.onclick = () => answer(v, b);
    box2.appendChild(b);
  }
  qStart = performance.now();
  mobTimer = ANSWER_TIME;
  locked = false;
}
function answer(v, btn){
  if(locked || !running) return;
  locked = true;
  const took = (performance.now() - qStart)/1000;
  [...$('ans').children].forEach(b => b.disabled = true);

  if(v === ans){
    right++;
    if(fastest === null || took < fastest) fastest = took;
    combo++; Stats.mark(qa + '×' + qb, true);
    btn.classList.add('right');
    const isWeak = mob.weak.includes(qa) || mob.weak.includes(qb);
    const speed = Math.max(1, Math.round((ANSWER_TIME - took) * 0.9));
    const isCrit = Math.random()*100 < P.crit;
    let dmg = Math.round((P.atk*0.7 + speed) * (isWeak ? 2 : 1) * (1 + Math.min(combo,8)*0.06) * (isCrit ? 1.8 : 1));
    Sfx.ok(combo);
    heroSwing(()=>{
      mobHp = Math.max(0, mobHp - dmg);
      totalDmg += dmg;
      hitEffect(isCrit, isWeak, mobHp <= 0);
      dmgText((isCrit ? '爆擊 ' : '') + '-' + dmg, isWeak || isCrit);
      setHp('mobHp', mobHp / mob.hp);
      $('mobHpText').textContent = mob.name + '　' + mobHp + ' / ' + mob.hp;
      ult = Math.min(100, ult + P.ult);
      paintUlt();
      if(mobHp <= 0) return killMob();
      comboAura(combo);
      const sp = spellFor(combo);
      if(sp){
        setTimeout(async ()=>{
          const dead = await castSpell(sp);
          if(dead) return killMob();
          setTimeout(newQ, 420);
        }, 380);
      }else{
        setTimeout(newQ, 460);
      }
    });
  }else{
    wrong++; combo = 0;
    comboAura(0);
    Stats.mark(qa + '×' + qb, false);
    btn.classList.add('wrong');
    [...$('ans').children].forEach(b => { if(+b.textContent === ans) b.classList.add('right'); });
    Sfx.bad();
    setTimeout(mobAttack, 420);
  }
}
function mobAttack(){
  if(!running) return;
  $('mob').classList.remove('attack'); void $('mob').offsetWidth; $('mob').classList.add('attack');
  setTimeout(()=>{
    heroHurtAnim();
    heroHp = Math.max(0, heroHp - mob.atk);
    paintHeroBar();
    Sfx.hurt();
    F().classList.remove('hurt'); void F().offsetWidth; F().classList.add('hurt');
    F().classList.remove('cam2'); void F().offsetWidth; F().classList.add('cam2');
    setTimeout(()=>F().classList.remove('cam2'), 420);
    Char.react(false);
    if(heroHp <= 0) return over(false);
    setTimeout(newQ, 700);
  }, 260);
}

/* ---------- 打倒敵人：經驗、金幣、掉裝備 ---------- */
function showDrop(html){
  const d = $('drop');
  d.innerHTML = html;
  d.classList.remove('on'); void d.offsetWidth; d.classList.add('on');
  setTimeout(()=>d.classList.remove('on'), 1600);
}
function killMob(){
  Sfx.win();
  kills++;
  Save.d.totalKill++;
  const gold = 18 + wave*8 + (mob.boss ? 70 : 0) + (round-1)*10;
  const exp  = Math.round(mob.exp * (1 + (round-1)*0.35));
  Save.d.gold += gold;
  earnGold += gold; earnExp += exp;
  const ups = Save.addExp(exp);

  $('mob').classList.add('die');
  F().classList.add('slowmo');
  slowmoField(700, .38);
  setTimeout(()=>F().classList.remove('slowmo'), 700);
  Char.react(true, true, mob.boss ? '把 Boss 打倒了！' : '打倒一隻！');
  Char.cat(true);
  dmgText('+' + gold + ' 金幣', true);

  // 掉裝備：Boss 必掉，小怪看機率；打越後面越容易出好貨
  let dropped = null;
  if(Math.random() < mob.drop){
    dropped = rollGear(Save.d.lv, (round-1)*0.25 + (mob.boss ? 0.6 : 0));
    Save.d.bag.push(dropped);
    drops.push(dropped);
  }
  Save.put();

  setTimeout(()=>{
    if(ups > 0){
      P = Save.power();
      const before = maxHp; maxHp = P.hp;
      heroHp = Math.min(maxHp, heroHp + (maxHp - before) + 25);   // 升級順便回一點血
      paintHeroBar();
      showDrop('<b style="color:var(--gold)">升級！Lv ' + Save.d.lv + '</b>' +
               '<small>攻擊與血量提升，回復 25 點血</small>');
      Sfx.win();
    }else if(dropped){
      showDrop('<b style="color:' + dropped.color + '">' + dropped.icon + ' ' + dropped.name +
               ' <span class="rar">' + dropped.rarity + '</span></b>' +
               '<small>' + gearLine(dropped) + '</small>');
    }
    paintTop();
  }, 500);

  setTimeout(()=>{
    $('mob').classList.remove('die','hit');
    wave++;
    if(wave >= MOBS.length){ round++; wave = 0; }
    Save.d.round = round; Save.d.wave = wave; Save.put();
    if(mob.boss){ return over(true); }
    setMob();
    newQ();
  }, 1400);
}
function setMob(){
  mob = {...MOBS[wave]};
  mob.hp = Math.round(mob.hp * (1 + (round-1)*0.5));
  mob.atk = Math.round(mob.atk * (1 + (round-1)*0.3));
  mobHp = mob.hp;
  $('mob').src = mob.img;        // 圖是漸進載的，直接指定就好，瀏覽器沒載好會自己補
  preloadNearby();               // 順手把下一隻先抓起來
  setHp('mobHp', 1);
  $('mobHpText').textContent = mob.name + '　' + mobHp + ' / ' + mob.hp;
  paintTop();
}
function paintUlt(){
  $('ultBar').style.width = ult + '%';
  const btn = $('ultBtn');
  btn.disabled = ult < 100 || !running;
  btn.classList.toggle('ready', ult >= 100 && running);
}
function useUlt(){
  if(ult < 100 || !running || !mob) return;
  ult = 0; paintUlt(); locked = true;
  $('ultfx').classList.add('on');
  Sfx.win();
  catRush();
  setTimeout(()=>{
    const dmg = Math.round(mob.hp * 0.3 + P.atk * 2.2);
    mobHp = Math.max(0, mobHp - dmg);
    totalDmg += dmg;
    hitEffect(true, true, mobHp <= 0);
    dmgText('-' + dmg, true);
    setHp('mobHp', mobHp / mob.hp);
    $('mobHpText').textContent = mob.name + '　' + mobHp + ' / ' + mob.hp;
    shake();
    $('ultfx').classList.remove('on');
    if(mobHp <= 0) return killMob();
    setTimeout(newQ, 500);
  }, 900);
}
function tick(){
  if(!running || locked){ paintTimer(); return; }
  mobTimer = Math.max(0, mobTimer - 0.1);
  paintTimer();
  if(mobTimer <= 0){
    locked = true;
    wrong++; combo = 0;
    Stats.mark(qa + '×' + qb, false);
    [...$('ans').children].forEach(b => { b.disabled = true; if(+b.textContent === ans) b.classList.add('right'); });
    mobAttack();
  }
}
const paintTimer = () => $('mobTimer').style.transform = 'scaleX(' + (mobTimer/ANSWER_TIME) + ')';

function start(){
  HERO = heroOf(Save.d.hero);
  heroFrame('ready');
  P = Save.power();
  maxHp = P.hp; heroHp = P.hp;
  running = true; locked = true;
  ult = 0; combo = 0;
  kills = 0; totalDmg = 0; right = 0; wrong = 0; fastest = null;
  earnGold = 0; earnExp = 0; drops = [];
  Save.d.playCount++; Save.put();
  $('over').classList.remove('on');
  $('mob').classList.remove('die','hit');
  paintHeroBar();
  setMob(); paintUlt(); newQ();
  clearInterval(loop); loop = setInterval(tick, 100);
  Sfx.next();
  $('start').textContent = '重 新 開 始';
}
function over(win){
  running = false; clearInterval(loop); loop = null;
  Save.put();
  $('ovTitle').textContent = win ? '全部打倒了！' : '這次沒過關';
  $('ovBig').textContent = win ? '🏆 第 ' + round + ' 輪' : round + '-' + (wave+1);
  $('ovKill').textContent = kills + ' 隻';
  $('ovDmg').textContent = totalDmg;
  $('ovQA').textContent = right + ' / ' + wrong;
  $('ovFast').textContent = fastest === null ? '—' : fastest.toFixed(2) + ' 秒';
  $('ovGold').textContent = earnGold + ' 金幣　經驗 +' + earnExp +
    (drops.length ? '　裝備 ×' + drops.length : '');
  $('ovWeak').innerHTML = Stats.weakHTML(6);
  setTimeout(()=>$('over').classList.add('on'), 700);
}

$('start').onclick = start;
$('again').onclick = start;
$('ultBtn').onclick = useUlt;
document.addEventListener('keydown', e => {
  const n = +e.key;
  if(n >= 1 && n <= 4){ const b = $('ans').children[n-1]; b && b.click(); }
  if(e.key === ' ') useUlt();
});

versionBar('battle.html');
startCoins();
setTimeout(()=>heroFrame('ready'), 300);
paintGear();
setMob(); paintTimer(); paintUlt();
maxHp = P.hp; heroHp = P.hp;
paintHeroBar();

</script>
